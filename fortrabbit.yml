# How fortrabbit builds a release when it receives a push.
#
# Only one pre and one post script run, and each is a PHP file — chaining is not supported — so
# everything that has to happen after a deploy lives in deploy.php.
version: 2

composer:
  # Production installs nothing from require-dev: Pint, PHPStan and PHPUnit are the gate CI runs,
  # and shipping them would put a test runner on a public host for no reason.
  no-dev: true

  # Nova's compiled assets live inside the package and are not in the repository, so something has
  # to publish them into `public/vendor`. It has to be Composer: this is the only phase whose file
  # writes become part of the release. `deploy.php` cannot do it — see the note there — and a
  # release with no `public/vendor/nova/mix-manifest.json` answers every panel page with 500,
  # because Nova's layout resolves its assets through `mix()`, which throws when the manifest is
  # missing rather than rendering an unstyled page. The publish itself is a Composer script in
  # `composer.json` (`post-install-cmd`), which is what fortrabbit runs here.

post: deploy.php

# Paths kept between releases instead of being replaced by the next one.
#
# This is about the running app's own filesystem across deploys. It does **not** share anything
# with the build, so it cannot carry a file `deploy.php` writes into the release — adding
# `public/vendor` here does not publish Nova's assets, which is a mistake already made once.
sustained:
  - vendor
  # This is what makes uploaded logos survive a deploy. fortrabbit mounts a shared persistent
  # volume at /data, where the app and its storage directory live, and `sustained` is what carries
  # that directory from one release to the next instead of replacing it. Remove it and every logo
  # goes with the next push.
  - storage
