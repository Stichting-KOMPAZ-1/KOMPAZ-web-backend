name: CI

on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The newest stable PHP, which is what the fortrabbit apps run today. Following the release
        # rather than pinning it means a deprecation is heard about when it lands, at the cost of a
        # build that can go red without a commit — and `composer.json` requires ^8.4, so a major
        # release stops the install rather than testing against something unsupported.
        php: ['latest']

    name: Test (PHP ${{ matrix.php }})

    env:
      APP_ENV: testing
      # Nova is a paid package on a private Composer repository. The secret holds the whole
      # auth.json document; Composer reads COMPOSER_AUTH natively, so nothing has to write a
      # credentials file into the workspace.
      COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

    services:
      # The schema enforces "at most one platform organization" with a generated column,
      # uniqueness folds through the collation, and a lost insert race is recognized by MySQL's own
      # error number. SQLite would exercise none of that, so CI runs the real thing.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: kompaz_test
          MYSQL_ROOT_PASSWORD: kompaz
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pkompaz"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, intl, zip
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - run: composer check

      - run: php artisan test
